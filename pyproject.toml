[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aimetadatacleaner-url-tools"
version = "0.1.0"
description = "Offline URL builder for AI Metadata Cleaner image, video, and PDF metadata pages. Not an official SDK."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "wangneo276-lgtm" }]

[project.urls]
Homepage = "https://aimetadatacleaner.pro/"
Repository = "https://github.com/wangneo276-lgtm/aimetadatacleaner-url-tools"
Issues = "https://github.com/wangneo276-lgtm/aimetadatacleaner-url-tools/issues"

[tool.setuptools.packages.find]
where = ["python"]
include = ["aimetadatacleaner_url_tools*"]
